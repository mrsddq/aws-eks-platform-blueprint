name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform format
        run: terraform fmt -recursive -check terraform
      - name: Terraform module validation
        run: make terraform-validate
      - name: Render selected Kubernetes resources
        run: kubectl kustomize kubernetes > /tmp/platform.yaml
      - name: Static validation
        run: make validate

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Checkov scan
        run: |
          python -m pip install --upgrade pip checkov
          checkov -d terraform -d kubernetes --quiet --soft-fail
